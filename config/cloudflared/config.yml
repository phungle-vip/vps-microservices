# Thay YOUR_TUNNEL_ID bằng UUID của Tunnel 2 (ví dụ: c4a2b1d3-...)
tunnel: d439fa52-c36d-4219-9982-e2e1ac7ecc18
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # 1. Wildcard 1 cấp: tự động đón TẤT CẢ các subdomain microservices định nghĩa trong services.env
  - hostname: "*.phungvip.io.vn"
    service: http://ms-nginx:80

  # 2. Apex domain chính (phungvip.io.vn)
  - hostname: "phungvip.io.vn"
    service: http://ms-nginx:80

  # 3. Catch-all fallback (bắt buộc ở cuối cùng)
  - service: http_status:404
